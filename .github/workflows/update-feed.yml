name: Update Trade Feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download feed
        run: |
          curl -L \
          "${{ secrets.APPS_SCRIPT_URL }}?token=${{ secrets.API_TOKEN }}" \
          -o data.json

      - name: Verify JSON
        run: |
          python -m json.tool data.json > /dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data.json

          git diff --staged --quiet || (
            git commit -m "Update trade feed"
            git push
          )
