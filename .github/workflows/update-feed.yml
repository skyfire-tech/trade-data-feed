name: Update Trade Feed

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JSON feed
        run: |
          curl -L "YOUR_APPS_SCRIPT_URL" -o data.json

      - name: Commit changes if data changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add data.json

          git diff --staged --quiet || (
            git commit -m "Update trade feed"
            git push
          )
